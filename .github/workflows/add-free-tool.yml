name: Add Free Tool Banner

on:
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  add-banner:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
        
      - name: Run banner insertion script
        run: |
          python3 add_free_tool_banner.py
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected:"
            git diff --stat
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html
          git commit -m "🎁 Add free email checker banner to homepage"
          git push
          
      - name: Success message
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "🎉 SUCCESS! Free tool banner added to homepage"
          echo "✅ Banner appears after hero section"
          echo "✅ Links to email-checker.html"
          echo "🌐 Website will be live in 1-2 minutes"
