name: Add SEO Tags Automatically

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  add-seo-tags:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Add SEO tags to index.html
        run: |
          # Add SEO tags after meta description in index.html
          sed -i '/<meta name="description"/a\    <!-- Enhanced SEO -->\n    <meta name="keywords" content="cybersecurity services India, OSINT investigation, email security check, threat intelligence">\n    <meta name="robots" content="index, follow">\n    <link rel="canonical" href="https://akatron-ai.github.io/akatron-website/">\n    <meta property="og:type" content="website">\n    <meta property="og:url" content="https://akatron-ai.github.io/akatron-website/">\n    <meta property="og:title" content="AKATRON - Elite Cybersecurity & OSINT Intelligence Services">\n    <meta property="og:description" content="Professional cybersecurity services starting at ₹999. Email risk analysis, OSINT investigations, and threat intelligence.">\n    <meta property="og:image" content="https://akatron-ai.github.io/akatron-website/akatron-logo.png">'\
           index.html
          
      - name: Add SEO tags to osint.html
        run: |
          sed -i '/<meta name="description"/a\    <meta name="keywords" content="OSINT services India, background check, digital footprint analysis">\n    <link rel="canonical" href="https://akatron-ai.github.io/akatron-website/osint.html">\n    <meta property="og:title" content="OSINT Investigations | AKATRON">\n    <meta property="og:url" content="https://akatron-ai.github.io/akatron-website/osint.html">'\
           osint.html
          
      - name: Add SEO tags to email-risk.html
        run: |
          sed -i '/<meta name="description"/a\    <meta name="keywords" content="email security check, data breach check, email hack check India">\n    <link rel="canonical" href="https://akatron-ai.github.io/akatron-website/email-risk.html">\n    <meta property="og:title" content="Email Risk Analysis | AKATRON">\n    <meta property="og:url" content="https://akatron-ai.github.io/akatron-website/email-risk.html">'\
           email-risk.html
          
      - name: Add SEO tags to threat-intelligence.html
        run: |
          sed -i '/<meta name="description"/a\    <meta name="keywords" content="threat intelligence India, cyber threat monitoring, dark web monitoring">\n    <link rel="canonical" href="https://akatron-ai.github.io/akatron-website/threat-intelligence.html">\n    <meta property="og:title" content="Threat Intelligence Services | AKATRON">\n    <meta property="og:url" content="https://akatron-ai.github.io/akatron-website/threat-intelligence.html">'\
           threat-intelligence.html
          
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html osint.html email-risk.html threat-intelligence.html
          git commit -m "✨ Add enhanced SEO meta tags to all pages" || echo "No changes to commit"
          git push
