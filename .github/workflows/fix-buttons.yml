name: Fix All Pricing Buttons

on:
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  fix-buttons:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
        
      - name: Run fix script
        run: |
          python3 fix_pricing_buttons.py
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected:"
            git diff --stat
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add osint.html threat-intelligence.html email-risk.html pricing.html about.html
          git commit -m "🔗 Fix all pricing buttons - Redirect to payment.html"
          git push
          
      - name: Success message
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "🎉 SUCCESS! All pricing buttons have been fixed."
          echo "✅ 17 buttons updated across 5 files"
          echo "🌐 Website will be live in 1-2 minutes"
          echo ""
          echo "View changes: https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)"
