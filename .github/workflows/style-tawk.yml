name: Style Tawk.to Chat Widget

on:
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  style-tawk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
        
      - name: Run styling script
        run: |
          python3 add_tawk_styling.py
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected:"
            git diff --stat
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.html
          git commit -m "🎨 Add professional Tawk.to styling to all pages"
          git push
          
      - name: Success message
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "🎉 SUCCESS! Professional Tawk.to styling added."
          echo "✅ Chat widget will now match AKATRON branding"
          echo "🌐 Website will be live in 1-2 minutes"
          echo ""
          echo "View changes: https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)"
