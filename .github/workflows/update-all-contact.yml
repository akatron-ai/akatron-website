name: Update All Contact Information

on:
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
        
      - name: Run comprehensive contact update script
        run: |
          python3 update_all_contact_info.py
          
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected:"
            git diff --stat
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.html **/*.html
          git commit -m "📞 Update all contact information to correct details"
          git push
          
      - name: Success message
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "🎉 SUCCESS! All contact information updated."
          echo "✅ Email: arpit.akatron@gmail.com"
          echo "✅ Phone: +91 9214297017"
          echo "✅ WhatsApp: +91 9214297017"
          echo "🌐 Website will be live in 1-2 minutes"
          echo ""
          echo "View changes: https://github.com/${{ github.repository }}/commit/$(git rev-parse HEAD)"
