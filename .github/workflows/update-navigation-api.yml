name: Update Navigation via API

on:
  workflow_dispatch:  # Manual trigger

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: pip install requests
    
    - name: Update navigation using GitHub API
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python3 update_navigation_api.py
    
    - name: Summary
      run: |
        echo "## ✨ Navigation Update Complete! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Updated Files:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ index.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ osint.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ threat-intelligence.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ email-risk.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ blog.html" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### New Navigation:" >> $GITHUB_STEP_SUMMARY
        echo "**Home | OSINT | Threat Intel | Email Risk | Pricing | Blog | About**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🌐 Visit your website in 2-3 minutes:" >> $GITHUB_STEP_SUMMARY
        echo "https://akatron-ai.github.io/akatron-website/" >> $GITHUB_STEP_SUMMARY
