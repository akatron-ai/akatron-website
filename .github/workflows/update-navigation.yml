name: Update Navigation Menus

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Update navigation in all files
      run: python3 update-all-navigation.py
      
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected"
        fi
    
    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add index.html osint.html threat-intelligence.html email-risk.html blog.html
        git commit -m "✨ Update navigation menus to include Pricing and About links"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Summary
      run: |
        echo "## Navigation Update Complete! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Updated navigation menus in:" >> $GITHUB_STEP_SUMMARY
        echo "- index.html" >> $GITHUB_STEP_SUMMARY
        echo "- osint.html" >> $GITHUB_STEP_SUMMARY
        echo "- threat-intelligence.html" >> $GITHUB_STEP_SUMMARY
        echo "- email-risk.html" >> $GITHUB_STEP_SUMMARY
        echo "- blog.html" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "New navigation includes: Home | OSINT | Threat Intel | Email Risk | **Pricing** | Blog | **About**" >> $GITHUB_STEP_SUMMARY
