name: Update Navigation Menus

on:
  workflow_dispatch:  # Manual trigger

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Update navigation using Node.js script
      run: node update-nav.js
      
    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "No changes detected"
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected"
          git diff --stat
        fi
    
    - name: Commit and push changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add index.html osint.html threat-intelligence.html email-risk.html blog.html
        git commit -m "✨ Update navigation menus to include Pricing and About links"
        git push
    
    - name: Summary
      run: |
        echo "## ✨ Navigation Update Complete! 🎉" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Updated Files:" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ index.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ osint.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ threat-intelligence.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ email-risk.html" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ blog.html" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### New Navigation:" >> $GITHUB_STEP_SUMMARY
        echo "Home | OSINT | Threat Intel | Email Risk | **Pricing** | Blog | **About**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🌐 Visit your website in 2-3 minutes: https://akatron-ai.github.io/akatron-website/" >> $GITHUB_STEP_SUMMARY
